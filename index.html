<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>محاكي اختبار معلم مساعد — النموذج الثالث</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700;800&display=swap">
<style>
/* التصميم: قاعة اختبار حكومية. شريط علوي كحلي بخط ذهبي، بطاقة سؤال بيضاء على أرضية رمادية مزرقة، وخريطة أسئلة جانبية */
:root{
  color-scheme:light;
  --bg:#E9EDF3; --surface:#FFFFFF; --surface-2:#F2F5FA; --ink:#14213D; --muted:#56637D; --line:#CFD7E3;
  --bar:#0F2250; --bar-ink:#FFFFFF; --bar-muted:#B9C6E4;
  --gold:#B8862B; --gold-ink:#7A5A14; --gold-soft:#F6ECD2; --gold-bar:#D8A93F;
  --btn:#12295B; --btn-ink:#FFFFFF; --sel:#E3ECFA; --sel-line:#12295B;
  --ok:#1B7A4B; --ok-soft:#DDF2E7; --warn:#A85A07; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#F9DEDC;
  --f-display:'Noto Kufi Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --f-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1322; --surface:#141F36; --surface-2:#1A2845; --ink:#E9EEF8; --muted:#9FADC8; --line:#2B3A5E;
    --bar:#091330; --bar-ink:#FFFFFF; --bar-muted:#9FB0D6;
    --gold:#D8A93F; --gold-ink:#EBCB7C; --gold-soft:#33280F; --gold-bar:#D8A93F;
    --btn:#D8A93F; --btn-ink:#10192E; --sel:#1F3566; --sel-line:#D8A93F;
    --ok:#5FCB97; --ok-soft:#12372A; --warn:#E6A653; --warn-soft:#3A2A10; --bad:#F28B83; --bad-soft:#40201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1322; --surface:#141F36; --surface-2:#1A2845; --ink:#E9EEF8; --muted:#9FADC8; --line:#2B3A5E;
  --bar:#091330; --bar-ink:#FFFFFF; --bar-muted:#9FB0D6;
  --gold:#D8A93F; --gold-ink:#EBCB7C; --gold-soft:#33280F; --gold-bar:#D8A93F;
  --btn:#D8A93F; --btn-ink:#10192E; --sel:#1F3566; --sel-line:#D8A93F;
  --ok:#5FCB97; --ok-soft:#12372A; --warn:#E6A653; --warn-soft:#3A2A10; --bad:#F28B83; --bad-soft:#40201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-block:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.5;margin:0;text-wrap:balance}
p{margin:0}
.in{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* الشريط العلوي */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--gold-bar)}
.top .in{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:.95rem;font-weight:700;line-height:1.4}
.brand span{display:block;font-size:.78rem;color:var(--bar-muted);line-height:1.4}
.hud{display:flex;align-items:center;gap:10px;flex:none}
.clock{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:1.25rem;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:2px 12px;border-radius:6px;direction:ltr;min-width:84px;text-align:center}
.clock.low{background:#B3261E;border-color:#F28B83;animation:pulse 1s steps(2) infinite}
.pill-sec{font-size:.8rem;color:var(--bar-muted);max-width:11rem;text-align:end;line-height:1.3}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--bar-ink);border-radius:6px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.prog{height:4px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;background:var(--gold-bar);transition:width .2s}
@keyframes pulse{50%{opacity:.65}}

/* عناصر مشتركة */
main.in{padding-block:22px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--gold-ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 22px;border-radius:6px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:600;cursor:pointer;font-size:1rem}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
table{border-collapse:collapse;width:100%}
.tw{overflow-x:auto}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);font-size:.93rem;white-space:nowrap}
th{background:var(--surface-2);font-weight:600;color:var(--muted);font-size:.82rem}
td.w{white-space:normal}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.75rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}

/* الصفحة الأولى */
.hero{display:grid;gap:14px;padding:26px 22px;border-radius:8px;background:var(--bar);color:var(--bar-ink);border-bottom:4px solid var(--gold-bar)}
.hero h1{font-size:clamp(1.35rem,4.6vw,2rem);font-weight:800}
.hero p{color:var(--bar-muted);max-width:60ch}
.hero .eyebrow{color:var(--gold-bar)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-top:18px}
.grid2>*{min-width:0}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.rules li{padding-inline-start:20px;position:relative;font-size:.95rem}
.rules li::before{content:"";position:absolute;inset-inline-start:0;top:.7em;width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
.field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.field input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 12px}
details.an{margin-top:18px}
details.an summary{cursor:pointer;font-family:var(--f-display);font-weight:700;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;list-style-position:inside}
details.an[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.an-body{border:1px solid var(--line);border-top:0;background:var(--surface);border-radius:0 0 8px 8px;padding:6px 18px 16px;display:grid;gap:12px}
.an-body h3{font-size:.95rem;color:var(--gold-ink);margin-top:10px}
.an-body ul{margin:4px 0 0;padding-inline-start:20px;font-size:.92rem}
.disc{font-size:.82rem;color:var(--muted);margin-top:14px}

/* الراحة */
.rest{display:grid;place-items:center}
.restcard{width:min(680px,100%);text-align:center;display:grid;gap:14px;justify-items:center}
.restcard h1{font-size:clamp(1.4rem,5vw,2rem);font-weight:800}
.count{font-family:var(--f-display);font-size:4.2rem;font-weight:800;color:var(--gold-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.facts div{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 6px}
.facts b{display:block;font-family:var(--f-display);font-size:1.25rem}
.facts span{font-size:.8rem;color:var(--muted)}
.tip{background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:12px 16px;text-align:start;width:100%;font-size:.95rem}
.steps{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.steps i{width:30px;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--ok)}
.steps i.cur{background:var(--gold)}

/* شاشة الأسئلة */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.qcard{padding:0;overflow:hidden}
.qhead{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.qhead b{font-family:var(--f-display);font-size:.95rem}
.qnum{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.flagbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.flagbtn.on{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.qbody{padding:22px 18px 8px}
.qtext{font-size:1.2rem;line-height:2.05;font-weight:500;margin-bottom:16px}
.qbody[dir="ltr"] .qtext{line-height:1.7;font-size:1.15rem}
.opts{display:grid;gap:10px;padding-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;min-height:52px}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .chip{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.85rem;font-weight:600;color:var(--muted)}
.opt .otxt{flex:1;min-width:0;line-height:1.8}
.opt.sel{background:var(--sel);border-color:var(--sel-line);box-shadow:inset 0 0 0 1px var(--sel-line)}
.opt.sel .chip{background:var(--sel-line);color:var(--btn-ink);border-color:var(--sel-line)}
.opt:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:2px}
.qfoot{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);margin-top:10px;flex-wrap:wrap}
.map{padding:16px}
.maphead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.maphead b{font-family:var(--f-display);font-size:.95rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;max-height:330px;overflow-y:auto;padding:2px}
.mb{height:38px;border-radius:5px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.82rem;font-variant-numeric:tabular-nums;padding:0}
.mb.ans{background:var(--sel);border-color:var(--sel-line);font-weight:600}
.mb.flag{border-color:var(--warn);box-shadow:inset 0 -4px 0 var(--warn)}
.mb.cur{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.75rem;color:var(--muted);margin:12px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-2px;margin-inline-end:4px}
.legend .a{background:var(--sel);border-color:var(--sel-line)}
.legend .f{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,25,.62);display:grid;place-items:center;padding:16px}
.modal .card{width:min(460px,100%);display:grid;gap:12px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;margin:0 auto;max-width:460px;background:var(--bar);color:#fff;border-radius:6px;padding:12px 16px;border-inline-start:4px solid var(--gold-bar);box-shadow:0 6px 24px rgba(0,0,0,.35)}

/* النتائج */
.verdict{display:grid;gap:8px;padding:24px 20px;border-radius:8px;border:1px solid var(--line);background:var(--surface);border-top:6px solid var(--muted)}
.verdict.pass{border-top-color:var(--ok)}
.verdict.fail{border-top-color:var(--bad)}
.verdict .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,3.4rem);line-height:1.2;font-variant-numeric:tabular-nums}
.verdict.pass .big{color:var(--ok)}
.verdict.fail .big{color:var(--bad)}
.sec-h{font-family:var(--f-display);font-size:1.15rem;margin:26px 0 10px}
.bar{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;min-width:120px;overflow:visible}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:6px;background:var(--btn)}
.bar i.g{background:var(--ok)}
.bar i.r{background:var(--bad)}
.bar u{position:absolute;inset-block:-4px;width:2px;background:var(--gold);inset-inline-start:80%}
.traits{display:grid;gap:12px}
.trait{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) auto;gap:12px;align-items:center}
.trait small{display:block;color:var(--muted);font-size:.78rem;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:.85rem}
.chips button.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.rq{padding:16px;display:grid;gap:10px}
.rq+.rq{margin-top:10px}
.rq h3{font-size:1rem;font-weight:500;line-height:1.9}
.rq[dir="ltr"] h3{line-height:1.6}
.ro{display:flex;gap:8px;align-items:flex-start;padding:7px 12px;border:1px solid var(--line);border-radius:6px;font-size:.93rem}
.ro.right{background:var(--ok-soft);border-color:var(--ok)}
.ro.wrong{background:var(--bad-soft);border-color:var(--bad)}
.ro em{font-style:normal;font-size:.75rem;margin-inline-start:auto;white-space:nowrap;font-weight:600}
.exp{font-size:.88rem;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:10px}
.foot{padding-block:22px calc(26px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:.85rem}
.foot b{color:var(--gold-ink);font-family:var(--f-display)}
.foot p+p{margin-top:4px;font-size:.78rem}

@media (max-width:860px){
  .exam{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .mgrid{max-height:220px}
}
@media (max-width:560px){
  .pill-sec{display:none}
  .brand span{display:none}
  .trait{grid-template-columns:minmax(0,1fr)}
  .qtext{font-size:1.1rem}
  .facts b{font-size:1.05rem}
  .count{font-size:3.4rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.trk{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.trk-o{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600}
.trk-o.on{border-color:var(--sel-line);background:var(--sel)}
.trk-o input{accent-color:var(--btn)}

.lockwall{position:fixed;inset:0;z-index:1000;background:rgba(9,19,48,.92);display:grid;place-items:center;padding:16px;overflow:auto}
.lockbox{background:var(--surface);color:var(--ink);border:2px solid var(--gold);border-radius:14px;max-width:440px;width:100%;padding:22px;display:grid;gap:12px}
.lockbox h2{font-size:1.2rem}
.lockbox input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:1.1rem;text-align:center}
.lkerr{color:var(--bad);min-height:1.4em;font-weight:600}
.lockbox .row{display:flex;gap:8px;flex-wrap:wrap}
.lockbox a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.subbox{display:grid;gap:8px;padding:12px;border:1px dashed var(--gold);border-radius:10px;background:var(--gold-soft);color:var(--gold-ink)}
.subbox a{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
</style>

</head>
<body>
<header class="top" id="top"></header>
<div id="app"></div>
<footer class="foot in">
  <p><b>مقدم من صفحة ببساطة</b> &middot; إعداد مستر محمد سيد</p>
  <p>اختبار تدريبي محاكٍ لأغراض التدريب فقط. ليس اختبارًا رسميًا ولا يتبع أي جهة حكومية، والأسئلة من إعداد الصفحة.</p>
</footer>
<div id="layer"></div>

<script>

const ui={confirm:false,rev:'ar',filter:'all'};
function fresh(){return {track:'ar',spIdx:null,name:'',phase:'intro',si:0,qi:0,ans:{},flag:{},endAt:0,restEnd:0,resume:false};}
let S=fresh();

ar:{id:'sp',name:'التخصص: اللغة العربية',short:'التخصص',n:50,min:20,graded:true,lang:'ar',opts:4,
  idea:'أدب وشعر جاهلي ومعلقات وصعاليك ومخضرمون ونقائض، وبلاغة، ونحو، وصرف، وإملاء وعلامات ترقيم. جميع الأسئلة في اللغة العربية نفسها دون أسئلة إكمال الآيات.',

qu:{id:'sp',name:'التخصص: القرآن الكريم',short:'التخصص',n:50,min:20,graded:true,lang:'ar',opts:4,

  tip:'50 سؤالًا في 20 دقيقة. ركّز على الآيات المتشابهة (قولوا آمنا / قل آمنا)، وعلى أواخر الآيات وفواصلها، وانتبه لحروف الجر والواو والفاء في الاختيارات.'}
};
const BANK=DATA.spBank;
function setTrack(track,idx){
  S.track=track;
  SECS.length=6;
  SECS.push(Object.assign({},SPEC[track]));
  TOTAL_GRADED=SECS.filter(s=>s.graded).reduce((a,s)=>a+s.n,0);
  if(idx&&idx.length===50)DATA.sp=idx.map(i=>BANK[track][i]).filter(Boolean);
  else DATA.sp=BANK[track].slice(0,50);
}
function pickIdx(track){
  const a=BANK[track].map((_,i)=>i);
  for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[a[i],a[k]]=[a[k],a[i]]}
  return a.slice(0,50);
}

function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function loadSaved(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function wipe(){try{localStorage.removeItem(LS_KEY)}catch(e){}}
const $=s=>document.querySelector(s);
const app=$('#app');setTrack('ar');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(ms){const t=Math.ceil(ms/1000);const m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function toast(msg){const l=$('#layer');const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;l.appendChild(d);setTimeout(()=>d.remove(),4200)}

    hud=`<div class="pill-sec">${esc(sec.name)}<br>المحور ${S.si+1} من ${SECS.length}</div><div class="clock" id="clock" aria-label="الوقت المتبقي">${fmt(Math.max(0,S.endAt-Date.now()))}</div>`;

  $('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'light':'dark'};

/* ---------- الراحة ---------- */
function renderRest(){
  const sec=SECS[S.si];
  const left=Math.ceil(Math.max(0,S.restEnd-Date.now())/1000);
  const steps=SECS.map((s,i)=>`<i class="${i<S.si?'done':i===S.si?'cur':''}" title="${esc(s.name)}"></i>`).join('');
  app.innerHTML=`<main class="in rest"><section class="card restcard">
    <p class="eyebrow">${S.si===0?'استعد لبدء الاختبار':'راحة 30 ثانية'} · المحور ${S.si+1} من ${SECS.length}</p>
    <h1>${esc(sec.name)}</h1>
    <div class="count" id="restc" aria-live="off">${left}</div>
    <div class="facts"><div><b>${sec.n}</b><span>سؤالًا</span></div><div><b>${sec.min}</b><span>دقيقة</span></div><div><b>${sec.opts}</b><span>اختيارات</span></div></div>
    <p style="text-align:start;width:100%"><b>فكرة المحور:</b> ${esc(sec.idea)}</p>
    <div class="tip"><b>نصيحة:</b> ${esc(sec.tip)}</div>
    <div class="steps" aria-hidden="true">${steps}</div>
    <button class="btn" id="skip">تخطي والبدء الآن</button>
  </section></main>`;
  $('#skip').onclick=beginSection;
}

/* ---------- الأسئلة ---------- */
function beginSection(){
  const sec=SECS[S.si];
  if(!S.ans[sec.id])S.ans[sec.id]=Array(sec.n).fill(-1);
  if(!S.flag[sec.id])S.flag[sec.id]={};
  S.phase='exam';S.qi=0;S.endAt=Date.now()+sec.min*60000;ui.confirm=false;
  save();render();window.scrollTo(0,0);
}
function renderExam(){
  const sec=SECS[S.si],qs=DATA[sec.id],i=S.qi,q=qs[i],isB=sec.id==='beh';
  const opts=isB?DATA.scales[q.s]:q.o;
  const L=sec.lang==='en'?LET_EN:LET_AR;
  const cur=S.ans[sec.id][i];
  const dir=sec.lang==='en'?'ltr':'rtl';
  const text=isB?q.t:q.q;
  const olist=opts.map((o,k)=>`<label class="opt${cur===k?' sel':''}"><input type="radio" name="o" value="${k}"${cur===k?' checked':''}><span class="chip">${L[k]}</span><span class="otxt">${esc(o)}</span></label>`).join('');
  const flagged=!!S.flag[sec.id][i];
  const last=i===sec.n-1;
  app.innerHTML=`<main class="in exam">
   <section class="card qcard">
     <div class="qhead"><div><b>${esc(sec.name)}</b> <span class="qnum">· سؤال ${i+1} من ${sec.n}</span></div>
       <button class="flagbtn${flagged?' on':''}" id="flag" aria-pressed="${flagged}">${flagged?'تمت العلامة للمراجعة':'علامة للمراجعة'}</button></div>
     <div class="qbody" dir="${dir}"><p class="qtext">${esc(text)}</p><div class="opts" role="radiogroup">${olist}</div></div>
     <div class="qfoot"><button class="btn ghost" id="prev"${i===0?' disabled':''}>السابق</button>
       ${last?'<button class="btn" id="end">مراجعة وإنهاء المحور</button>':'<button class="btn" id="next">التالي</button>'}</div>
   </section>
   <aside class="card map"><div class="maphead"><b>خريطة الأسئلة</b><span class="qnum" id="mcount"></span></div>
     <div class="mgrid" id="mgrid"></div>
     <div class="legend"><span><i class="a"></i>تمت الإجابة</span><span><i class="f"></i>للمراجعة</span><span><i></i>بلا إجابة</span></div>
     <button class="btn danger" id="finish" style="width:100%">إنهاء المحور</button></aside>
  </main>`;
  drawMap();
  document.querySelectorAll('.opt input').forEach(inp=>inp.addEventListener('change',()=>setAnswer(+inp.value)));
  $('#prev').onclick=()=>goTo(i-1);
  if(last)$('#end').onclick=openConfirm;else $('#next').onclick=()=>goTo(i+1);
  $('#finish').onclick=openConfirm;
  $('#flag').onclick=()=>{const f=S.flag[sec.id];if(f[i])delete f[i];else f[i]=1;save();renderExam()};
  renderHeader();
}
function drawMap(){
  const sec=SECS[S.si],a=S.ans[sec.id],f=S.flag[sec.id];
  $('#mgrid').innerHTML=a.map((v,k)=>`<button class="mb${v>=0?' ans':''}${f[k]?' flag':''}${k===S.qi?' cur':''}" data-k="${k}" aria-label="سؤال ${k+1}${v>=0?' (تمت الإجابة)':''}">${k+1}</button>`).join('');
  $('#mgrid').onclick=e=>{const b=e.target.closest('.mb');if(b)goTo(+b.dataset.k)};
  $('#mcount').textContent=a.filter(x=>x>=0).length+' / '+sec.n;
  const cur=$('#mgrid .cur');if(cur&&cur.scrollIntoView)cur.scrollIntoView({block:'nearest'});
}
function goTo(k){const sec=SECS[S.si];if(k<0||k>=sec.n)return;S.qi=k;save();renderExam()}
function setAnswer(v){
  const sec=SECS[S.si];const i=S.qi;
  S.ans[sec.id][i]=v;save();
  document.querySelectorAll('.opt').forEach((el,k)=>el.classList.toggle('sel',k===v));
  drawMap();
  const pb=$('#progbar');if(pb)pb.style.width=Math.round(S.ans[sec.id].filter(x=>x>=0).length/sec.n*100)+'%';
  if(sec.id==='beh'&&i<sec.n-1)setTimeout(()=>{if(S.phase==='exam'&&S.si===SECS.indexOf(sec)&&S.qi===i)goTo(i+1)},260);
}
function openConfirm(){
  const sec=SECS[S.si],a=S.ans[sec.id];
  const un=a.filter(x=>x<0).length,fl=Object.keys(S.flag[sec.id]).length;
  const last=S.si===SECS.length-1;
  $('#layer').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card">
    <h2 id="mt" style="font-size:1.15rem">إنهاء محور ${esc(sec.name)}؟</h2>
    <p>${un?`لديك <b>${un}</b> سؤالًا بلا إجابة. `:'أجبت عن كل الأسئلة. '}${fl?`وعندك <b>${fl}</b> سؤالًا عليه علامة مراجعة. `:''}لن تستطيع العودة إلى هذا المحور بعد الإنهاء.</p>
    <div class="row"><button class="btn danger" id="yes">${last?'إنهاء الاختبار وعرض النتيجة':'إنهاء والانتقال للراحة'}</button><button class="btn ghost" id="no">العودة للأسئلة</button></div></div></div>`;
  $('#no').onclick=()=>{$('#layer').innerHTML=''};
  $('#yes').onclick=()=>{$('#layer').innerHTML='';finishSection(false)};
  $('#no').focus();
}
function finishSection(auto){
  $('#layer').querySelectorAll('.modal').forEach(m=>m.remove());
  if(S.si>=SECS.length-1){S.phase='results';ui.rev='ar';ui.filter='all';}
  else{S.si++;S.phase='rest';S.restEnd=Date.now()+REST_MS;}
  save();render();window.scrollTo(0,0);
  if(auto)toast('انتهى وقت المحور وتم تسليم إجاباتك تلقائيًا.');
}

/* ---------- التصحيح ---------- */
function gradeAll(){
  return SECS.filter(s=>s.graded).map(s=>{
    const a=S.ans[s.id]||Array(s.n).fill(-1),qs=DATA[s.id];
    let c=0,w=0,u=0;
    qs.forEach((q,i)=>{if(a[i]<0)u++;else if(a[i]===q.a)c++;else w++;});
    return {sec:s,c,w,u,pct:c/s.n};
  });
}
const ADVICE={
 coop:'تدرّب على مشاركة الزملاء المعلومات وعلى قبول العمل الجماعي وتدريب الجدد.',
 learn:'اجعل لنفسك وقتًا ثابتًا للقراءة والتدريب ومتابعة الجديد في التدريس.',
 cult:'تمرّن على الإنصات للرأي المخالف واحترام اختلاف العادات والثقافات.',
 solo:'ابدأ بالمبادرة في المهام الصغيرة ونظّم وقتك بنفسك دون انتظار التذكير.',
 resp:'تحمّل نتائج قراراتك، واعترف بالخطأ، وأبلغ مديرك بتأخرك مبكرًا بدل إخفائه.',
 integ:'تمسّك بالمبادئ واللوائح مهما كان المقابل، فهذه السمة حاسمة في الوظائف الحكومية.',
 emo:'درّب نفسك على الهدوء عند الغضب والضغط، وخذ نفسًا قبل الرد.',
 conf:'تدرّب على التعبير عن رأيك بثقة وأدب، واعتبر النقد البنّاء فرصة للتحسن.'
};
function analyzeBeh(){
  const a=S.ans.beh||Array(160).fill(-1),qs=DATA.beh;
  const val=qs.map((q,i)=>{const x=a[i];if(x<0)return null;let v=5-x;if(q.r)v=6-v;return v});
  const answered=val.filter(v=>v!==null).length;
  const traits=DATA.traits.map(t=>{
    const vs=qs.map((q,i)=>q.tr===t.id?val[i]:null).filter(v=>v!==null);
    const m=vs.length?vs.reduce((x,y)=>x+y,0)/vs.length:0;
    const score=vs.length?Math.round((m-1)/4*100):0;
    const level=score>=80?['مرتفع','ok']:score>=65?['مناسب','ok']:score>=50?['يحتاج تنمية','warn']:['غير مناسب','bad'];
    return Object.assign({},t,{score,level,count:vs.length});
  });
  const byPair={};qs.forEach((q,i)=>{(byPair[q.p]=byPair[q.p]||[]).push(val[i])});
  let sum=0,cnt=0,incon=0;
  Object.values(byPair).forEach(p=>{if(p[0]!==null&&p[1]!==null){const d=Math.abs(p[0]-p[1]);sum+=d;cnt++;if(d>=3)incon++;}});
  const consistency=cnt?Math.round(100-(sum/cnt)/4*100):0;
  const avg=Math.round(traits.reduce((x,t)=>x+t.score,0)/traits.length);
  const minT=Math.min(...traits.map(t=>t.score));
  const integ=traits.find(t=>t.id==='integ').score;
  let verdict;
  if(answered<128)verdict=['تقرير غير مكتمل','warn','أجبت عن '+answered+' من 160 عبارة فقط، ولا يمكن الحكم على ملاءمتك بدقة. أجب عن معظم العبارات في المحاولة القادمة.'];
  else if(consistency<65)verdict=['نتيجة غير موثوقة','bad','ظهر تناقض واضح بين إجاباتك على العبارات المتشابهة. ثبات الإجابات علامة على صدقك، فأجب عن كل عبارة وفق مبدئك الحقيقي.'];
  else if(minT<50||integ<60)verdict=['غير مناسب للوظيفة بصورة حالية','bad','هناك سمة أو أكثر دون الحد المطلوب. راجع السمات المنخفضة أدناه وتدرّب عليها.'];
  else if(avg>=70&&minT>=60)verdict=['مناسب للوظيفة','ok','سماتك متوازنة وثابتة، وهذا يناسب طبيعة عمل المعلم.'];
  else verdict=['مناسب بتحفظ','warn','سماتك مقبولة عمومًا، لكن بعضها يحتاج تنمية حتى تصل لمستوى أعلى.'];
  return {answered,traits,consistency,incon,pairs:cnt,avg,verdict};
}

/* ---------- النتائج ---------- */
function renderResults(){
  const g=gradeAll();
  const correct=g.reduce((x,r)=>x+r.c,0);
  const overall=correct/TOTAL_GRADED;
  const pass=overall>=PASS;
  const b=analyzeBeh();
  const name=S.name?esc(S.name):'المتقدم';
  const rows=g.map(r=>{
    const ok=r.pct>=PASS;
    return `<tr><td class="w"><b>${esc(r.sec.name)}</b></td><td class="num">${r.c} / ${r.sec.n}</td><td style="min-width:150px"><div class="bar"><i class="${ok?'g':'r'}" style="width:${Math.round(r.pct*100)}%"></i><u></u></div></td><td class="num"><b>${Math.round(r.pct*100)}%</b></td><td>${ok?'<span class="tag ok">فوق 80%</span>':'<span class="tag bad">تحت 80%</span>'}</td><td class="num">${r.u?`<span class="tag warn">${r.u} بلا إجابة</span>`:''}</td></tr>`;
  }).join('');
  const weak=g.filter(r=>r.pct<PASS).sort((x,y)=>x.pct-y.pct).map(r=>r.sec.name);
  const trs=b.traits.map(t=>`<div class="trait"><div><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></div><div class="bar"><i class="${t.level[1]==='ok'?'g':t.level[1]==='bad'?'r':''}" style="width:${t.score}%;${t.level[1]==='warn'?'background:var(--warn)':''}"></i></div><div><span class="tag ${t.level[1]}">${t.level[0]}</span> <span class="num" style="font-size:.85rem">${t.score}%</span></div></div>`).join('');
  const low=b.traits.filter(t=>t.score<65);
  const adv=low.length?`<ul style="margin:6px 0 0;padding-inline-start:20px">${low.map(t=>`<li><b>${esc(t.name)}:</b> ${esc(ADVICE[t.id])}</li>`).join('')}</ul>`:'<p>لا توجد سمات تحتاج تنمية عاجلة.</p>';
  app.innerHTML=`<main class="in">
   <section class="verdict ${pass?'pass':'fail'}">
     <p class="eyebrow">نتيجة ${name}</p>
     <div class="big">${pass?'ناجح':'لم يجتز'} · ${(overall*100).toFixed(1)}%</div>
     <p>أجبت إجابة صحيحة عن <b class="num">${correct}</b> من <b class="num">${TOTAL_GRADED}</b> سؤالًا في المحاور المُدرَّجة. نسبة الاجتياز المطلوبة 80% (${Math.ceil(TOTAL_GRADED*PASS)} سؤالًا على الأقل).</p>
     ${weak.length?`<p>المحاور الأقل من 80%: <b>${weak.map(esc).join('، ')}</b>. ركّز عليها أولًا.</p>`:'<p>كل المحاور فوق 80%. أحسنت.</p>'}
   </section>
   <h2 class="sec-h">الدرجات حسب المحور</h2>
   <section class="card"><div class="tw"><table><thead><tr><th>المحور</th><th>الصحيح</th><th>النسبة (الخط الذهبي = 80%)</th><th></th><th>الحالة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
   <h2 class="sec-h">تقرير الجدارات السلوكية</h2>
   <section class="card" style="display:grid;gap:16px">
     <div class="row"><span class="tag ${b.verdict[1]}" style="font-size:.95rem;padding:3px 14px">${esc(b.verdict[0])}</span><span class="num" style="font-size:.9rem">أجبت عن ${b.answered} / 160 · ثبات الإجابات ${b.consistency}%${b.incon?` · ${b.incon} أزواج متناقضة`:''}</span></div>
     <p>${esc(b.verdict[2])}</p>
     <div class="traits">${trs}</div>
     <div><b>توصيات للتنمية</b>${adv}</div>
     <p class="disc" style="margin:0">الثبات يقيس اتساق إجاباتك على عبارات متشابهة جاءت بصيغ مختلفة (مثل التعاون مع الزملاء ومساعدتهم). كلما تقاربت إجاباتك كان التقرير أدق.</p>
   </section>
   <h2 class="sec-h">مراجعة الإجابات</h2>
   <div class="chips" id="revsec">${g.map(r=>`<button data-s="${r.sec.id}" class="${ui.rev===r.sec.id?'on':''}">${esc(r.sec.short)}</button>`).join('')}</div>
   <div class="chips" id="revf" style="margin-top:10px">${[['all','الكل'],['wrong','الأخطاء'],['un','بلا إجابة']].map(([k,t])=>`<button data-f="${k}" class="${ui.filter===k?'on':''}">${t}</button>`).join('')}</div>
   <div id="revlist" style="margin-top:14px"></div>
   <div class="row" style="margin-top:22px"><button class="btn" id="again">اختبار جديد</button></div>
  </main>`;
  drawReview();
  $('#revsec').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.rev=b.dataset.s;renderResults();$('#revsec').scrollIntoView({block:'center'})};
  $('#revf').onclick=e=>{const b=e.target.closest('button');if(!b)return;ui.filter=b.dataset.f;renderResults();$('#revf').scrollIntoView({block:'center'})};
  $('#again').onclick=()=>{const n=S.name;wipe();S=fresh();S.name=n;render();window.scrollTo(0,0)};
}
function drawReview(){
  const sec=SECS.find(s=>s.id===ui.rev),qs=DATA[sec.id],a=S.ans[sec.id]||Array(sec.n).fill(-1);
  const L=sec.lang==='en'?LET_EN:LET_AR,dir=sec.lang==='en'?'ltr':'rtl';
  const items=qs.map((q,i)=>({q,i,u:a[i]})).filter(({q,u})=>ui.filter==='all'||(ui.filter==='wrong'&&u>=0&&u!==q.a)||(ui.filter==='un'&&u<0));
  $('#revlist').innerHTML=items.length?items.map(({q,i,u})=>{
    const st=u<0?'<span class="tag warn">بلا إجابة</span>':u===q.a?'<span class="tag ok">صحيحة</span>':'<span class="tag bad">خاطئة</span>';
    const os=q.o.map((o,k)=>`<div class="ro${k===q.a?' right':k===u?' wrong':''}"><b>${L[k]}</b><span>${esc(o)}</span>${k===q.a?'<em>الإجابة الصحيحة</em>':k===u?'<em>إجابتك</em>':''}</div>`).join('');
    return `<article class="card rq" dir="${dir}"><div class="row" dir="rtl"><span class="qnum">سؤال ${i+1}</span>${st}</div><h3>${esc(q.q)}</h3>${os}<p class="exp" dir="rtl">${esc(q.e)}</p></article>`;
  }).join(''):'<div class="card">لا توجد أسئلة في هذا التصنيف.</div>';
}

/* ---------- التشغيل ---------- */
function render(){
  renderHeader();
  if(S.phase==='intro')renderIntro();
  else if(S.phase==='rest')renderRest();
  else if(S.phase==='exam')renderExam();
  else renderResults();
}
setInterval(()=>{
  const now=Date.now();
  if(S.phase==='exam'){
    const left=Math.max(0,S.endAt-now),c=$('#clock');
    if(c){c.textContent=fmt(left);c.classList.toggle('low',left<60000)}
    if(left<=0)finishSection(true);
  }else if(S.phase==='rest'){
    const left=Math.ceil(Math.max(0,S.restEnd-now)/1000),r=$('#restc');
    if(r&&r.textContent!==String(left))r.textContent=left;
    if(left<=0)beginSection();
  }
},250);
document.addEventListener('keydown',e=>{
  if(S.phase!=='exam'||document.querySelector('.modal')||document.querySelector('.lockwall'))return;
  if(e.target&&e.target.tagName==='INPUT'&&(e.target.type==='text'||e.target.type==='password'))return;
  const sec=SECS[S.si];
  if(/^[1-5]$/.test(e.key)&&+e.key<=sec.opts){setAnswer(+e.key-1);const r=document.querySelectorAll('.opt input')[+e.key-1];if(r)r.checked=true;}
  else if(e.key==='ArrowLeft')goTo(S.qi+1);
  else if(e.key==='ArrowRight')goTo(S.qi-1);
});

/* ---------- الفترة التجريبية وكلمة السر والاشتراك ---------- */
const WA_NUMBER='201505191893';            // ضع رقم واتساب بالصيغة الدولية بدون + مثال: 201012345678
const SUB_PRICE=100, TRIAL_SEC=120, PASS_CODE='108';
const K_TRIAL='caoa-trial-v1', K_UNLOCK='caoa-unlock-v1';
let trialUsed=0, unlocked=false;
try{trialUsed=+localStorage.getItem(K_TRIAL)||0;unlocked=localStorage.getItem(K_UNLOCK)==='1'}catch(e){}
function waLink(){
  const msg='السلام عليكم، أرغب في الاشتراك في محاكي اختبار معلم مساعد. قيمة الاشتراك '+SUB_PRICE+' جنيهًا. برجاء إرسال طريقة الدفع وكلمة السر.'+(S&&S.name?'\nالاسم: '+S.name:'');
  return 'https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(msg);
}
function trialBlocked(){return !unlocked&&trialUsed>=TRIAL_SEC}
function showLock(){
  if(unlocked||document.querySelector('.lockwall'))return;
  const w=document.createElement('div');w.className='lockwall';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
  w.innerHTML=`<div class="lockbox"><h2>انتهت الفترة التجريبية</h2>
  <p>استخدمت الفترة التجريبية (${TRIAL_SEC} ثانية). للمتابعة اشترك بقيمة <b>${SUB_PRICE} جنيهًا</b> واحصل على كلمة السر عبر واتساب.</p>
  <label for="lkpw">كلمة السر</label>
  <input id="lkpw" type="password" inputmode="numeric" autocomplete="off" placeholder="أدخل كلمة السر">
  <p id="lkerr" class="lkerr" role="alert"></p>
  <div class="row"><button class="btn" id="lkok">فتح الاختبار</button>
  <a class="btn ghost" id="lkwa" href="${waLink()}" target="_blank" rel="noopener">تواصل واتساب للاشتراك</a></div></div>`;
  document.body.appendChild(w);
  const pw=w.querySelector('#lkpw'),err=w.querySelector('#lkerr');
  const tryUnlock=()=>{
    if(pw.value.trim()===PASS_CODE){unlocked=true;try{localStorage.setItem(K_UNLOCK,'1')}catch(e){}w.remove();toast('تم فتح الاختبار بنجاح')}
    else{err.textContent='كلمة السر غير صحيحة';pw.select()}
  };
  w.querySelector('#lkok').onclick=tryUnlock;
  pw.onkeydown=e=>{if(e.key==='Enter')tryUnlock()};
  setTimeout(()=>pw.focus(),50);
}
setInterval(()=>{
  if(unlocked)return;
  if(S.phase==='rest'||S.phase==='exam'){
    if(trialUsed<TRIAL_SEC){trialUsed++;try{localStorage.setItem(K_TRIAL,String(trialUsed))}catch(e){}}
    if(trialUsed>=TRIAL_SEC)showLock();
  }
},1000);

render();
</script>
